# RTX 2080 Ti (11 GB, Turing sm_75): float16 only, no FlashAttention-2, no FP8.
# A 3B VLM runs in fp16; for a 7-8B VLM uncomment the 4-bit block.
hardware_profile: rtx2080ti          # fp16 + sdpa, batch 2, 4k context, ~350k pixels per image
model:
  backend: hf
  name_or_path: unsloth/gemma-3-270m-it
  # name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
  # quantization: 4bit               # bitsandbytes NF4 (fp16 compute on Turing)
run:
  tasks: [tamil]
  limit: 100
  sampling: stratified
