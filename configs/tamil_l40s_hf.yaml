# Tamil-focused evaluation of a 7B VLM with transformers on one L40S (48 GB).
hardware_profile: l40s
model:
  backend: hf
  name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
  dtype: bfloat16
  attn_implementation: sdpa          # flash_attention_2 if flash-attn is installed
generation:
  max_new_tokens: 256
run:
  tasks: [tamil]                     # tamil_text + tamil_vision + English anchors
  limit: 200                         # per task
  sampling: stratified               # balanced across MILU domains/subjects etc.
  batch_size: 8
  output_dir: results
