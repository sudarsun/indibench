# Cross-lingual Indic sweep with vLLM on one A100-80G. Produces a family × language matrix.
hardware_profile: a100-80g
model:
  backend: vllm
  name_or_path: google/gemma-3-12b-it
  dtype: bfloat16
  max_model_len: 8192
  gpu_memory_utilization: 0.90
  image: {max_images: 4}
generation:
  max_new_tokens: 256
run:
  tasks: [indic_text, indic_vision]
  languages: [indic_major]           # ta, hi, te, kn, ml, bn, mr, gu
  limit: 300
  sampling: stratified
  batch_size: 64                     # vLLM schedules internally; larger batches = better throughput
