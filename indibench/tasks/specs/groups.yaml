# Task groups (suites). Entries may be task names, glob patterns, or other groups.
# Combine with `--languages ta,hi` (or `indic`, `dravidian`) to filter language-expanded tasks.

groups:
  tamil_text:
    description: Tamil text understanding, knowledge, QA, translation and summarisation.
    tasks: [belebele_ta, milu_ta, indicsentiment_ta, indicxnli_ta, indicqa_ta,
            flores_en-ta, flores_ta-en, in22conv_en-ta, xlsum_ta]
  tamil_vision:
    description: Tamil-script OCR and Tamil-output visual grounding.
    tasks: [synth_ocr_ta, pope_xl_ta]
  tamil:
    description: Everything Tamil (text + vision) plus English anchors.
    tasks: [tamil_text, tamil_vision, belebele_en, pope]
  tamil_open:
    description: Tamil suite restricted to datasets that need no gated access.
    tasks: [belebele_ta, indicsentiment_ta, indicxnli_ta, indicqa_ta, in22conv_en-ta, synth_ocr_ta, pope_xl_ta]

  indic_text:
    description: Cross-lingual text suite — use with --languages to pick languages.
    tasks: ["belebele_*", "milu_*", "indicsentiment_*", "indicxnli_*", "indicqa_*", "flores_en-*", "in22conv_en-*"]
  indic_vision:
    description: Indic-script OCR and cross-lingual grounding.
    tasks: ["synth_ocr_*", "pope_xl_*"]

  vision_core:
    description: Standard multimodal capability suite (English).
    tasks: [mmmu_val, mathvista_testmini, chartqa, docvqa_val, textvqa_val, ocrbench, ai2d,
            scienceqa_img, mmbench_en_dev, pope, mme]

  quick:
    description: Smoke suite — a handful of fast tasks; pair with --limit 50.
    tasks: [belebele_ta, belebele_en, indicsentiment_ta, synth_ocr_ta, pope_xl_ta, pope, ai2d, chartqa]

  # ---------------------------------------------------------------- additional Indic suites
  indic_knowledge:
    description: Knowledge MCQ across Indic languages (MILU, INCLUDE, MMLU/ARC/TriviaQA/BoolQ-Indic).
    tasks: ["milu_*", "include_*", "mmlu_indic_*", "indicmmlu_pro_*", "global_mmlu_*", "arc_indic_*",
            "triviaqa_indic_mcq_*", "boolq_indic_*"]
  indicgenbench:
    description: Google IndicGenBench generation tasks (XQuAD-IN, CrossSum-IN, Flores-IN).
    tasks: ["xquad_in_*", "crosssum_in_*", "flores_in_en-*"]
  tamil_extended:
    description: The tamil suite plus every additional Tamil benchmark.
    tasks: [tamil, include_ta, mmlu_indic_ta, indicmmlu_pro_ta, arc_indic_ta, triviaqa_indic_mcq_ta,
            boolq_indic_ta, xquad_in_ta, crosssum_in_ta, flores_in_en-ta, tanglish_sentiment,
            offensive_codemix_ta, drishtikon_ta]

  # ---------------------------------------------------------------- English / domains
  indian_english:
    description: English benchmarks sourced from India (MILU-en, NEET/AIIMS, IIT-JEE, Indic TriviaQA-en, Tanglish).
    tasks: [milu_en, triviaqa_indic_mcq_en, global_mmlu_en, medmcqa, jeebench, tanglish_sentiment,
            drishtikon_en]
  english_core:
    description: General English knowledge & reasoning.
    tasks: [mmlu_en, mmlu_pro, arc_challenge, hellaswag, winogrande, truthfulqa_mc1, gpqa_diamond, ifeval]
  math:
    description: Math word problems to olympiad level (GSM8K, MATH-500, AIME 24, MGSM, JEE maths).
    tasks: [gsm8k, math500, aime24, "mgsm_*", jeebench]
  science:
    description: Science & medicine (GPQA, ARC, MedMCQA, JEEBench, MMLU-Pro, ARC-Indic).
    tasks: [gpqa_diamond, arc_challenge, medmcqa, jeebench, mmlu_pro, "arc_indic_*"]
  code:
    description: Programming (HumanEval, MBPP) — requires --allow-code-execution.
    tasks: [humaneval, mbpp]
  stem:
    description: math + science + code.
    tasks: [math, science, code]

  indian_culture:
    description: Indian cultural knowledge, text and image (MILU, INCLUDE, DRISHTIKON, Global-MMLU culture-sensitive).
    tasks: ["milu_*", "include_*", "drishtikon_*", "global_mmlu_*"]
  safety:
    description: Truthfulness, hallucination, instruction following and code-mixed content moderation.
    tasks: [truthfulqa_mc1, pope, ifeval, "offensive_codemix_*"]

  full:
    description: Everything except predict-only and code-execution tasks.
    tasks: [indic_text, indic_vision, vision_core, mmlu_en, xlsum_ta, flores_ta-en,
            indic_knowledge, indicgenbench, indian_english, english_core, math, science,
            indian_culture, safety]
